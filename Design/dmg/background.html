<!doctype html>
<!-- Shortty DMG background (minimal). 660 × 400 points; Finder draws the app icon at (165, 205) and
     Applications at (495, 205), both 128 pt, with their names underneath. Keep that area clear. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600&family=IBM+Plex+Mono&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 660px; height: 400px; overflow: hidden; position: relative; background: #fff; color: #121212; font-family: 'Hanken Grotesk', sans-serif; }
  h1 { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font: 300 26px/1 'Hanken Grotesk'; letter-spacing: -0.03em; }
  .sel { position: absolute; left: 97px; top: 137px; width: 136px; height: 128px; outline: 1px solid #ff6b3d; }
  .sel i { position: absolute; width: 7px; height: 7px; background: #fff; outline: 1px solid #ff6b3d; }
  .sel i:nth-child(1) { top: -4px; left: -4px; } .sel i:nth-child(2) { top: -4px; right: -4px; }
  .sel i:nth-child(3) { bottom: -4px; left: -4px; } .sel i:nth-child(4) { bottom: -4px; right: -4px; }
  .size { position: absolute; left: 97px; top: 116px; padding: 2px 5px; font: 10px/1 'IBM Plex Mono'; background: #ff6b3d; color: #fff; }
  .arrow { position: absolute; left: 262px; top: 199px; width: 136px; height: 12px; }
  .hint { position: absolute; left: 0; right: 0; bottom: 30px; text-align: center; font-size: 11.5px; line-height: 1.6; color: #8a8a8a; }
  .hint b { color: #121212; font-weight: 600; }
  /* Name tags behind Finder's icon labels. Finder draws the labels black in light mode and white in
     dark mode, so this mid-tone keeps both readable (about 4:1 either way). */
  .nametag { position: absolute; top: 272px; width: 118px; height: 22px; background: #7a7a7a; }
  .nametag.app { left: 106px; } .nametag.apps { left: 436px; }
</style></head><body>
  <h1>Drag Shortty into Applications.</h1>
  <div class="sel"><i></i><i></i><i></i><i></i></div>
  <div class="size">128 × 128</div>
  <svg class="arrow" viewBox="0 0 136 12"><path d="M2 6 H128 M122 1 L130 6 L122 11" fill="none" stroke="#bdbdbd" stroke-width="1.2"/></svg>
  <p class="hint">If macOS blocks the first launch: <b>System Settings → Privacy &amp; Security → Open Anyway</b>.<br>Shortty is free and not signed by Apple. You only do this once.</p>
  <div class="nametag app"></div><div class="nametag apps"></div>
</body></html>
