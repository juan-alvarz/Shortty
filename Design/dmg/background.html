<!doctype html>
<!-- Shortty DMG background (pastel). 660 × 400 points; Finder draws the app icon at (165, 205) and
     Applications at (495, 205), both 128 pt, with their names underneath. Keep that area clear. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Onest:wght@400;600&family=DM+Mono:wght@500&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 660px; height: 400px; overflow: hidden; position: relative; background: #ddd5ff; color: #221d3a; font-family: 'Onest', sans-serif; }
  h1 { position: absolute; left: 36px; top: 30px; font: 30px/1 'Young Serif', Georgia, serif; letter-spacing: -0.02em; }
  .tile { position: absolute; top: 125px; width: 160px; height: 184px; }
  .tile.a { left: 85px; background: #ffd8c4; box-shadow: 10px 10px 0 #ff6b3d; }
  .tile.b { left: 415px; background: #c9f0dc; box-shadow: 10px 10px 0 #221d3a; }
  .pill { position: absolute; left: 290px; top: 189px; width: 80px; height: 32px; display: grid; place-items: center; background: #221d3a; color: #fff; font: 600 16px/1 'Onest'; box-shadow: 4px 4px 0 #ff6b3d; }
  .hint { position: absolute; left: 36px; right: 36px; bottom: 24px; font-size: 11.5px; line-height: 1.55; color: #4f4870; }
  .hint b { color: #221d3a; }
  .tag { display: inline-block; margin-right: 6px; padding: 2px 6px; font: 500 10px/1.3 'DM Mono'; text-transform: uppercase; background: #221d3a; color: #fff; }
  /* Name tags behind Finder's icon labels. Finder draws the labels black in light mode and white in
     dark mode, so this mid-tone keeps both readable (about 4:1 either way). */
  .nametag { position: absolute; top: 272px; width: 118px; height: 22px; background: #7f74bf; }
  .nametag.app { left: 106px; } .nametag.apps { left: 436px; }
</style></head><body>
  <h1>Drag Shortty into Applications</h1>
  <div class="tile a"></div><div class="tile b"></div>
  <div class="pill">→</div>
  <p class="hint"><span class="tag">First open</span>Blocked? Shortty is free, so it isn't signed by Apple.
  <b>System Settings → Privacy &amp; Security → Open Anyway.</b> Just once.</p>
  <div class="nametag app"></div><div class="nametag apps"></div>
</body></html>
