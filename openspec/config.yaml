schema: spec-driven

context: |
  Shortty is a free macOS 14+ menu bar screenshot app (Swift 6, SwiftUI + AppKit). AGENTS.md is the source of truth for build steps, the code map and coding rules; read it before planning.
  No third-party dependencies, ever. Prefer the platform (AppKit, CoreGraphics, Vision) over new code.
  Every behavior change needs a check in Scripts/SelfCheck/main.swift; UI changes also need a look at the self-check snapshots.
  Everything runs on-device: no network calls, accounts or tracking.
  Editor chrome uses custom line icons (Icons.swift), not SF Symbols, and fixed sRGB colors so exports match.
  Capability specs live in openspec/specs/<capability>/spec.md and describe user-visible behavior, not implementation.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

rules:
  tasks:
    - Include a task to add or update the matching check in Scripts/SelfCheck/main.swift
    - End with running Scripts/selfcheck.sh and the Swift 6 xcodebuild type-check from AGENTS.md
  design:
    - Name the AGENTS.md recipe the change follows (new tool, control, setting or capture action) when one applies

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
