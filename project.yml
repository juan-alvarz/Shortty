name: Shortty
options:
  bundleIdPrefix: com.shortty # bundle id = com.shortty.Shortty
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Shortty Dev" # local cert from Scripts/make-signing-cert.sh; stable identity keeps TCC grants
targets:
  Shortty:
    type: application
    platform: macOS
    sources:
      - path: Shortty
    postBuildScripts:
      # Xcode never updates the .app folder's own date, and Finder/Dock only refresh a cached icon when it changes.
      - name: Refresh the bundle date
        script: touch "$TARGET_BUILD_DIR/$WRAPPER_NAME"
        basedOnDependencyAnalysis: false
    info:
      path: Shortty/Resources/Info.plist
      properties:
        CFBundleShortVersionString: "1.2.0" # the release version; bump with each GitHub release
        CFBundleVersion: "3"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png, public.jpeg, public.tiff, public.heic]
