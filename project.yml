name: Shortty
options:
  bundleIdPrefix: com.socialgoodsoftware
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Shortty Dev" # local cert from Scripts/make-signing-cert.sh; stable identity keeps TCC grants
targets:
  Shortty:
    type: application
    platform: macOS
    sources:
      - path: Shortty
    info:
      path: Shortty/Resources/Info.plist
      properties:
        CFBundleDisplayName: Shortty
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.png, public.jpeg, public.tiff, public.heic]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.socialgoodsoftware.Shortty
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
